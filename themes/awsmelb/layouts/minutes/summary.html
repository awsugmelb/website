<div class="card mb-3">
    <div class="row no-gutters">
        <div class="col-md-4">
            <a href="{{ .RelPermalink }}"><img src="{{.Params.Image }}" class="card-img mb-0"></a>
        </div>
        <div class="col-md-8">
            <div class="card-body">
                <h5 class="card-title">{{ .Title }}</h5>
                <p class="card-text">{{ if .Description }}{{.Description}}{{ else }}{{ .Summary }}{{ end }}</p>
                <a href="{{ .RelPermalink }}" class="card-link">Read minutes &raquo;</a>
            </div>
        </div>
    </div>
</div>
